<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas {
            display: block;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            mix-blend-mode: difference;
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        #hotbar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 100;
        }
        .hotbar-slot {
            width: 50px;
            height: 50px;
            border: 3px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .hotbar-slot.active {
            border-color: white;
        }
        .hotbar-slot span {
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }
        #block-preview {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="info">
        <div><strong>Controls:</strong></div>
        <div>WASD - Move</div>
        <div>Space - Jump</div>
        <div>Shift - Descend</div>
        <div>Left Click - Break Block</div>
        <div>Right Click - Place Block</div>
        <div>1-6 - Select Block Type</div>
        <div>Click to Start</div>
    </div>
    <div id="hotbar">
        <div class="hotbar-slot active" data-type="grass"><span style="background: #4a8f3a; width: 30px; height: 30px; display: block;"></span></div>
        <div class="hotbar-slot" data-type="dirt"><span style="background: #8b5a2b; width: 30px; height: 30px; display: block;"></span></div>
        <div class="hotbar-slot" data-type="stone"><span style="background: #808080; width: 30px; height: 30px; display: block;"></span></div>
        <div class="hotbar-slot" data-type="wood"><span style="background: #654321; width: 30px; height: 30px; display: block;"></span></div>
        <div class="hotbar-slot" data-type="leaves"><span style="background: #228b22; width: 30px; height: 30px; display: block;"></span></div>
        <div class="hotbar-slot" data-type="sand"><span style="background: #f4d03f; width: 30px; height: 30px; display: block;"></span></div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // Controls
        const controls = new PointerLockControls(camera, document.body);
        let isLocked = false;

        document.addEventListener('click', () => {
            if (!isLocked) {
                controls.lock();
            }
        });

        controls.addEventListener('lock', () => {
            isLocked = true;
        });

        controls.addEventListener('unlock', () => {
            isLocked = false;
        });

        // Block types with colors
        const blockTypes = {
            grass: { color: 0x4a8f3a, name: 'Grass' },
            dirt: { color: 0x8b5a2b, name: 'Dirt' },
            stone: { color: 0x808080, name: 'Stone' },
            wood: { color: 0x654321, name: 'Wood' },
            leaves: { color: 0x228b22, name: 'Leaves' },
            sand: { color: 0xf4d03f, name: 'Sand' }
        };

        let selectedBlockType = 'grass';

        // Block storage
        const blocks = new Map();
        const blockMeshes = [];

        // Geometry and materials cache
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const materials = {};

        Object.entries(blockTypes).forEach(([type, data]) => {
            materials[type] = new THREE.MeshLambertMaterial({ color: data.color });
        });

        // Create a block
        function createBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocks.has(key)) return null;

            const material = materials[type];
            const mesh = new THREE.Mesh(blockGeometry, material);
            mesh.position.set(x + 0.5, y + 0.5, z + 0.5);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { x, y, z, type };

            scene.add(mesh);
            blocks.set(key, mesh);
            blockMeshes.push(mesh);

            return mesh;
        }

        // Remove a block
        function removeBlock(x, y, z) {
            const key = `${x},${y},${z}`;
            const mesh = blocks.get(key);
            if (mesh) {
                scene.remove(mesh);
                blocks.delete(key);
                const index = blockMeshes.indexOf(mesh);
                if (index > -1) {
                    blockMeshes.splice(index, 1);
                }
            }
        }

        // Generate terrain
        function generateTerrain() {
            const size = 32;
            const baseHeight = 5;

            for (let x = -size / 2; x < size / 2; x++) {
                for (let z = -size / 2; z < size / 2; z++) {
                    // Simple height variation using sine waves
                    const height = Math.floor(
                        baseHeight + 
                        Math.sin(x * 0.1) * 3 + 
                        Math.cos(z * 0.1) * 3 +
                        Math.sin((x + z) * 0.05) * 2
                    );

                    for (let y = 0; y <= height; y++) {
                        let type = 'stone';
                        if (y === height) {
                            type = 'grass';
                        } else if (y > height - 3) {
                            type = 'dirt';
                        }
                        createBlock(x, y, z, type);
                    }
                }
            }

            // Add some trees
            for (let i = 0; i < 15; i++) {
                const treeX = Math.floor(Math.random() * size - size / 2);
                const treeZ = Math.floor(Math.random() * size - size / 2);
                
                // Find ground level at this position
                let groundY = 0;
                for (let y = 20; y >= 0; y--) {
                    if (blocks.has(`${treeX},${y},${treeZ}`)) {
                        groundY = y;
                        break;
                    }
                }

                if (groundY > 0) {
                    createTree(treeX, groundY + 1, treeZ);
                }
            }
        }

        // Create a tree
        function createTree(x, y, z) {
            // Trunk
            for (let i = 0; i < 5; i++) {
                createBlock(x, y + i, z, 'wood');
            }

            // Leaves
            for (let dx = -2; dx <= 2; dx++) {
                for (let dz = -2; dz <= 2; dz++) {
                    for (let dy = 3; dy <= 5; dy++) {
                        if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy - 4) <= 3) {
                            if (!blocks.has(`${x + dx},${y + dy},${z + dz}`)) {
                                createBlock(x + dx, y + dy, z + dz, 'leaves');
                            }
                        }
                    }
                }
            }
        }

        // Generate initial terrain
        generateTerrain();

        // Player movement
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };

        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': keys.space = true; break;
                case 'ShiftLeft': keys.shift = true; break;
                case 'Digit1': selectHotbarSlot(0); break;
                case 'Digit2': selectHotbarSlot(1); break;
                case 'Digit3': selectHotbarSlot(2); break;
                case 'Digit4': selectHotbarSlot(3); break;
                case 'Digit5': selectHotbarSlot(4); break;
                case 'Digit6': selectHotbarSlot(5); break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
                case 'ShiftLeft': keys.shift = false; break;
            }
        });

        // Hotbar selection
        function selectHotbarSlot(index) {
            const slots = document.querySelectorAll('.hotbar-slot');
            slots.forEach(slot => slot.classList.remove('active'));
            slots[index].classList.add('active');
            selectedBlockType = slots[index].dataset.type;
        }

        // Raycasting for block interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0);

        document.addEventListener('mousedown', (event) => {
            if (!isLocked) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(blockMeshes);

            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];
                const { x, y, z } = intersect.object.userData;

                if (event.button === 0) {
                    // Left click - break block
                    removeBlock(x, y, z);
                } else if (event.button === 2) {
                    // Right click - place block
                    const normal = intersect.face.normal;
                    const newX = x + Math.round(normal.x);
                    const newY = y + Math.round(normal.y);
                    const newZ = z + Math.round(normal.z);
                    
                    // Don't place block where player is standing
                    const playerPos = camera.position;
                    const playerBox = {
                        minX: playerPos.x - 0.3,
                        maxX: playerPos.x + 0.3,
                        minY: playerPos.y - 1.6,
                        maxY: playerPos.y + 0.2,
                        minZ: playerPos.z - 0.3,
                        maxZ: playerPos.z + 0.3
                    };

                    const blockBox = {
                        minX: newX,
                        maxX: newX + 1,
                        minY: newY,
                        maxY: newY + 1,
                        minZ: newZ,
                        maxZ: newZ + 1
                    };

                    const overlaps = !(playerBox.maxX < blockBox.minX || 
                                     playerBox.minX > blockBox.maxX ||
                                     playerBox.maxY < blockBox.minY || 
                                     playerBox.minY > blockBox.maxY ||
                                     playerBox.maxZ < blockBox.minZ || 
                                     playerBox.minZ > blockBox.maxZ);

                    if (!overlaps) {
                        createBlock(newX, newY, newZ, selectedBlockType);
                    }
                }
            }
        });

        // Prevent context menu on right click
        document.addEventListener('contextmenu', (event) => {
            event.preventDefault();
        });

        // Physics and collision detection
        let canJump = false;
        const playerHeight = 1.8;
        const playerRadius = 0.3;

        function checkCollision(newPos) {
            const x = Math.floor(newPos.x);
            const y = Math.floor(newPos.y - playerHeight + 0.5);
            const z = Math.floor(newPos.z);

            // Check player's bounding box against blocks
            for (let dy = 0; dy < 2; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        const checkX = Math.floor(newPos.x + dx * playerRadius);
                        const checkY = Math.floor(newPos.y - playerHeight + 0.5 + dy);
                        const checkZ = Math.floor(newPos.z + dz * playerRadius);
                        
                        if (blocks.has(`${checkX},${checkY},${checkZ}`)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Animation loop
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            if (isLocked) {
                // Movement
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.0 * delta; // Gravity

                direction.z = Number(keys.w) - Number(keys.s);
                direction.x = Number(keys.d) - Number(keys.a);
                direction.normalize();

                if (keys.w || keys.s) velocity.z -= direction.z * 100.0 * delta;
                if (keys.a || keys.d) velocity.x -= direction.x * 100.0 * delta;

                // Apply horizontal movement with collision detection
                const oldPos = camera.position.clone();
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                if (checkCollision(camera.position)) {
                    camera.position.copy(oldPos);
                    velocity.x = 0;
                    velocity.z = 0;
                }

                // Vertical movement
                const oldY = camera.position.y;
                camera.position.y += velocity.y * delta;

                if (checkCollision(camera.position)) {
                    camera.position.y = oldY;
                    
                    if (velocity.y < 0) {
                        canJump = true;
                    }
                    velocity.y = 0;
                }

                // Jumping
                if (keys.space && canJump) {
                    velocity.y = 10;
                    canJump = false;
                }

                // Flying down with shift
                if (keys.shift) {
                    camera.position.y -= 5 * delta;
                }

                // Keep player above void
                if (camera.position.y < -20) {
                    camera.position.set(0, 20, 0);
                    velocity.set(0, 0, 0);
                }
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
