<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 3D - Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: monospace; }
        #info { position: fixed; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; z-index: 100; }
        #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 20px; height: 20px; pointer-events: none; z-index: 100; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { width: 2px; height: 20px; left: 9px; }
        #crosshair::after { width: 20px; height: 2px; top: 9px; }
        #hotbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 100; }
        .slot { width: 50px; height: 50px; border: 3px solid #888; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-shadow: 1px 1px 0 #000; cursor: pointer; }
        .slot.active { border-color: white; transform: scale(1.1); }
        #instructions { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.9); color: white; padding: 30px; border-radius: 10px; text-align: center; z-index: 200; }
        #instructions h1 { margin-bottom: 15px; }
        #instructions p { margin: 8px 0; }
        #startBtn { margin-top: 20px; padding: 12px 30px; font-size: 16px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="info"><div>FPS: <span id="fps">0</span></div><div>Blocks: <span id="blockCount">0</span></div></div>
    <div id="crosshair"></div>
    <div id="hotbar">
        <div class="slot active" style="background:#7CFC00" data-type="grass">1</div>
        <div class="slot" style="background:#8B4513" data-type="dirt">2</div>
        <div class="slot" style="background:#808080" data-type="stone">3</div>
        <div class="slot" style="background:#DEB887" data-type="wood">4</div>
        <div class="slot" style="background:#228B22" data-type="leaves">5</div>
        <div class="slot" style="background:#F4D03F" data-type="sand">6</div>
    </div>
    <div id="instructions">
        <h1>🎮 Minecraft 3D</h1>
        <p>WASD - Move | SPACE - Jump | Mouse - Look</p>
        <p>Left Click - Break | Right Click - Place</p>
        <p>1-6 - Select Block | F - Fly Mode</p>
        <button id="startBtn">Click to Play</button>
    </div>
    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        
        const WORLD_SIZE = 48, BLOCK_SIZE = 1;
        const BLOCK_TYPES = { grass:0x7CFC00, dirt:0x8B4513, stone:0x808080, wood:0xDEB887, leaves:0x228B22, sand:0xF4D03F };
        let selectedBlock = 'grass';
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 60);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(WORLD_SIZE/2, 20, WORLD_SIZE/2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        scene.add(dirLight);
        
        const controls = new PointerLockControls(camera, document.body);
        const blocks = new Map(), blockMeshes = [];
        const geometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
        const materials = {};
        
        function createTexture(color) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#' + color.toString(16).padStart(6,'0');
            ctx.fillRect(0,0,64,64);
            for(let i=0;i<300;i++) ctx.fillStyle=`rgba(${Math.random()*50},${Math.random()*50},${Math.random()*50},0.3)`,ctx.fillRect(Math.random()*64,Math.random()*64,2,2);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = tex.minFilter = THREE.NearestFilter;
            return tex;
        }
        
        Object.keys(BLOCK_TYPES).forEach(k => materials[k] = new THREE.MeshLambertMaterial({ map: createTexture(BLOCK_TYPES[k]) }));
        
        function noise(x, z) { return Math.floor(Math.sin(x*0.1)*Math.cos(z*0.1)*4 + Math.cos((x+z)*0.05)*2 + 8); }
        
        function placeBlock(x, y, z, type, update=true) {
            const key = `${x},${y},${z}`;
            if(blocks.has(key)) return false;
            const mesh = new THREE.Mesh(geometry, materials[type]);
            mesh.position.set(x, y, z);
            mesh.castShadow = mesh.receiveShadow = true;
            mesh.userData = { type, x, y, z };
            scene.add(mesh);
            blocks.set(key, mesh);
            blockMeshes.push(mesh);
            if(update) document.getElementById('blockCount').textContent = blocks.size;
            return true;
        }
        
        function removeBlock(mesh) {
            const {x,y,z} = mesh.userData;
            blocks.delete(`${x},${y},${z}`);
            blockMeshes.splice(blockMeshes.indexOf(mesh),1);
            scene.remove(mesh);
            document.getElementById('blockCount').textContent = blocks.size;
        }
        
        function generateWorld() {
            for(let x=0; x<WORLD_SIZE; x++) {
                for(let z=0; z<WORLD_SIZE; z++) {
                    const h = noise(x,z);
                    for(let y=0; y<=h; y++) placeBlock(x,y,z, y===h?'grass':y>h-3?'dirt':'stone', false);
                    if(Math.random()<0.02 && x>2 && x<WORLD_SIZE-2 && z>2 && z<WORLD_SIZE-2) createTree(x,h+1,z);
                }
            }
        }
        
        function createTree(x,y,z) {
            const th = 4+Math.floor(Math.random()*2);
            for(let i=0;i<th;i++) placeBlock(x,y+i,z,'wood',false);
            for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++) for(let dy=th-1;dy<=th+1;dy++) 
                if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-th)<4 && !blocks.has(`${x+dx},${y+dy},${z+dz}`)) placeBlock(x+dx,y+dy,z+dz,'leaves',false);
        }
        
        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2(0,0);
        function getTarget() {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(blockMeshes);
            return hits.length>0 && hits[0].distance<6 ? hits[0] : null;
        }
        
        let selectedMesh = null;
        function updateHighlight() {
            if(selectedMesh) { selectedMesh.material.emissive.setHex(0); selectedMesh=null; }
            const t = getTarget();
            if(t) { selectedMesh=t.object; selectedMesh.material.emissive.setHex(0x333333); }
        }
        
        const keys = {};
        let flyMode = false, velocity = new THREE.Vector3(), canJump = false;
        
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.key>='1'&&e.key<='6') {
                document.querySelectorAll('.slot').forEach((s,i)=>s.classList.toggle('active',i===parseInt(e.key)-1));
                selectedBlock = document.querySelectorAll('.slot')[parseInt(e.key)-1].dataset.type;
            }
            if(e.code==='KeyF') flyMode = !flyMode;
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        
        document.addEventListener('mousedown', e => {
            if(!controls.isLocked) return;
            const t = getTarget();
            if(!t) return;
            if(e.button===0) removeBlock(t.object);
            else if(e.button===2) {
                const p = t.object.position.clone().add(t.face.normal);
                if(p.distanceTo(camera.position.clone().setY(camera.position.y-1.5))>1.5) placeBlock(p.x,p.y,p.z,selectedBlock);
            }
        });
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        function checkCollision(x,y,z) { return blocks.has(`${Math.round(x)},${Math.round(y)},${Math.round(z)}`); }
        
        function updatePhysics(delta) {
            if(!controls.isLocked) return;
            const speed = flyMode ? 15 : 8;
            const dir = new THREE.Vector3();
            if(keys['KeyW']) dir.z -= 1;
            if(keys['KeyS']) dir.z += 1;
            if(keys['KeyA']) dir.x -= 1;
            if(keys['KeyD']) dir.x += 1;
            dir.normalize();
            
            if(flyMode) {
                if(keys['KeyW']||keys['KeyS']) { camera.translateZ(-dir.z*speed*delta); camera.translateX(dir.x*speed*delta); }
                if(keys['Space']) camera.position.y += speed*delta;
                if(keys['ShiftLeft']) camera.position.y -= speed*delta;
            } else {
                if(dir.length()>0) {
                    const angle = camera.rotation.y;
                    const newX = Math.sin(angle)*dir.z*speed*delta + Math.cos(angle)*dir.x*speed*delta;
                    const newZ = Math.cos(angle)*dir.z*speed*delta - Math.sin(angle)*dir.x*speed*delta;
                    if(!checkCollision(camera.position.x+newX,camera.position.y,camera.position.z)&&!checkCollision(camera.position.x+newX,camera.position.y-1,camera.position.z)) camera.position.x += newX;
                    if(!checkCollision(camera.position.x,camera.position.y,camera.position.z+newZ)&&!checkCollision(camera.position.x,camera.position.y-1,camera.position.z+newZ)) camera.position.z += newZ;
                }
                if(canJump && keys['Space']) { velocity.y = 8; canJump = false; }
                velocity.y -= 25*delta;
                const newY = camera.position.y + velocity.y*delta;
                if(checkCollision(camera.position.x,newY-1.5,camera.position.z)) { camera.position.y = Math.ceil(newY-1.5)+1.5; velocity.y = 0; canJump = true; }
                else camera.position.y = newY;
                if(camera.position.y < -10) { camera.position.set(WORLD_SIZE/2,30,WORLD_SIZE/2); velocity.y = 0; }
            }
        }
        
        let frameCount=0, lastTime=performance.now(), fps=0;
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(new THREE.Clock().getDelta(), 0.1);
            updatePhysics(delta);
            updateHighlight();
            frameCount++;
            if(performance.now()-lastTime>=1000) { fps=frameCount; frameCount=0; lastTime=performance.now(); document.getElementById('fps').textContent=fps; }
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
        document.getElementById('startBtn').addEventListener('click', () => { document.getElementById('instructions').classList.add('hidden'); controls.lock(); });
        controls.addEventListener('unlock', () => document.getElementById('instructions').classList.remove('hidden'));
        
        generateWorld();
        document.getElementById('blockCount').textContent = blocks.size;
        animate();
    </script>
</body>
</html>
